<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWI Prediction</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a; /* dark navy */
            font-family: 'Segoe UI', sans-serif;
        }

        .container-box {
            margin-top: 40px;
            background: #1e293b; 
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.3);
            color: #fff;
        }

        h1 {
            color: #ff6b81;
            font-weight: 700;
        }

        .form-control {
            background: #334155;
            border: none;
            color: #fff;
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus {
            background: #475569;
            outline: none;
            box-shadow: 0px 0px 5px #38bdf8;
            color: #fff;
        }

        .gradient-btn {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            font-size: 18px;
            margin-top: 20px;
            border-radius: 12px;
            transition: 0.3s;
        }

        .gradient-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0px 5px 15px rgba(0, 114, 255, 0.5);
        }

        .result-box {
            background: #0f172a;
            border: 1px solid #334155;
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .result-text {
            font-size: 25px;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <div class="container col-md-10 mt-5">
        <div class="container-box">

            <h1 class="text-center">FWI Prediction</h1>
            <p class="text-center mb-4">Predict Fire Weather Index with AI</p>

            <form action="/" method="POST">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Temperature (°C)</label>
                        <input type="number" step="any" name="Temperature" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Relative Humidity (%)</label>
                        <input type="number" step="any" name="RH" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Wind Speed (km/h)</label>
                        <input type="number" step="any" name="Ws" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Rain (mm)</label>
                        <input type="number" step="any" name="Rain" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Fine Fuel Moisture Code</label>
                        <input type="number" step="any" name="FFMC" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Duff Moisture Code</label>
                        <input type="number" step="any" name="DMC" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Initial Spread Index</label>
                        <input type="number" step="any" name="ISI" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Classes</label>
                        <input type="number" step="any" name="Classes" class="form-control" required>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Region</label>
                        <input type="number" step="any" name="Region" class="form-control" required>
                    </div>

                </div>

                <button type="submit" class="gradient-btn">Predict</button>
            </form>

            {% if results %}
            <div class="result-box">
                <p class="result-text text-warning">
                    FWI: {{ results }}
                </p>
            </div>
            {% endif %}

        </div>
    </div>

</body>

</html>
